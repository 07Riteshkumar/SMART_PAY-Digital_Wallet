<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMARTPAY – Digital Wallet</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>SMARTPAY</h2>
        <span>Digital Wallet</span>
    </header>

    <main>
        <section class="welcome-card">

            <div class="card-icon">
                <i class="fa-solid fa-credit-card"></i>
            </div>

            <h1>Welcome to SmartPay</h1>

            <p>
                Your smart and simple digital wallet. Make payments,
                manage your balance, and enjoy a seamless payment experience.
            </p>

            <div class="features">
                <div>✔ Secure Digital Payments</div>
                <div>✔ Instant Transactions</div>
                <div>✔ Cashback Rewards</div>
            </div>

            <button onclick="startPayment()">Start Payment</button>

        </section>
    </main>

    <footer>
        SmartPay | Digital Wallet Simulator
    </footer>

    <script src="script.js"></script>

    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

</body>
</html>
